<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170a21">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="color-scheme" content="only dark">
<meta name="supported-color-schemes" content="dark">
<title>AdoleSente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app mobile-first. Cabeçalho, uma tela por vez, barra de abas fixa embaixo.
   Frutiger Metro = vidro e brilho (Frutiger Aero) + tiles planos em grade (Metro).
   Todas as cores e fontes abaixo são editáveis pelo Estúdio. */
:root{
  --brand:#6C318C; --accent:#892CB0; --surface:#06C300; --text:#06A700;
  --on-brand:#fff; --on-accent:#fff; --on-surface:#06260a;
  --ink:#f1e6f8; --muted:#bfa8cf; --head:#e2bff5;
  --bg:#170a21; --bg2:#0e2310; --card:rgba(46,24,64,.78); --card-solid:#2a1639; --line:rgba(255,255,255,.16);
  --r-card:24px; --r-btn:999px; --r-input:12px; --r-tile:16px;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --nav-h:calc(54px + 1.2rem); --scale:1; --logo-h:38px;
}
/* Tema escuro fixo: igual em qualquer aparelho, independente do modo do sistema. */
:root{color-scheme:only dark}
html,body{forced-color-adjust:none;-webkit-text-size-adjust:100%;print-color-adjust:exact;-webkit-print-color-adjust:exact}

*{box-sizing:border-box}
:root{font-size:calc(17.5px * var(--scale))}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px);min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--surface) 38%,transparent) 0 70px,transparent 71px),
   radial-gradient(circle at 88% 22%,color-mix(in srgb,var(--accent) 30%,transparent) 0 110px,transparent 111px),
   radial-gradient(circle at 70% 78%,color-mix(in srgb,var(--surface) 26%,transparent) 0 90px,transparent 91px),
   radial-gradient(circle at 8% 70%,color-mix(in srgb,var(--brand) 22%,transparent) 0 130px,transparent 131px),
   radial-gradient(circle at 46% 96%,color-mix(in srgb,var(--extra) 34%,transparent) 0 100px,transparent 101px),
   linear-gradient(160deg,var(--bg),var(--bg2));
  background-color:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);color:var(--head);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,6vw,2.6rem)} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
.accent-text{color:var(--text)}
.muted{color:var(--muted);font-size:.92rem}
.lbl{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.brandmark img{height:var(--logo-h);width:auto;max-width:62vw;object-fit:contain;display:block}
.brandmark b{font-family:var(--f-display);font-size:clamp(1.1rem,calc(var(--logo-h) * .6),3rem);color:var(--head);letter-spacing:-.01em}
.brandmark b i{font-style:normal;color:var(--text)}
.whatbtn{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--head);font:600 .85rem var(--f-display);cursor:pointer;white-space:nowrap}
.whatbtn:hover{border-color:var(--accent)}
.about p{margin:0 0 12px;line-height:1.6}
.iconbtn{width:44px;height:44px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--card);color:var(--head);
  display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.iconbtn svg{width:22px;height:22px}

/* vidro */
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px -14px color-mix(in srgb,var(--brand) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* botões brilhantes */
.btn{--c:var(--brand);--on:var(--on-brand);position:relative;overflow:hidden;border:0;cursor:pointer;
  font:600 1rem var(--f-body);color:var(--on);padding:12px 22px;min-height:44px;border-radius:var(--r-btn);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 88%,#000));
  box-shadow:0 6px 14px -6px color-mix(in srgb,var(--c) 80%,#000),inset 0 -2px 0 rgba(0,0,0,.12);
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn::after{content:"";position:absolute;left:6%;right:6%;top:3px;height:46%;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(1px)}
.btn.accent{--c:var(--accent);--on:var(--on-accent)}
.btn.surface{--c:var(--surface);--on:var(--on-surface)}
.btn.ghost{background:var(--card);color:var(--head);border:1px solid var(--line);box-shadow:none}
.btn.ghost::after{display:none}
.btn.small{min-height:36px;padding:6px 14px;font-size:.9rem}
.btn.danger{--c:#b3261e;--on:#fff}
body.flat .btn::after{display:none}
body.nobubbles .bg{background:linear-gradient(160deg,var(--bg),var(--bg2))}
body.flat .btn{background:var(--c);box-shadow:none}

input,select,textarea{font:inherit;color:var(--ink);background:var(--card-solid);border:1.5px solid var(--line);
  border-radius:var(--r-input);padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px}
input[type=color]{padding:3px;width:52px;min-height:40px;cursor:pointer}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--accent)}
input[type=file]{padding:8px;font-size:.85rem}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;color:var(--head)}
.notes-font{font-family:var(--f-mono)}

/* tiles Metro */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}
button,a,select,summary,.note,.fcard,.tile{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tile{--c:var(--brand);--w:3;--h:116px;--rad:var(--r-tile);position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
  grid-column:span var(--w);min-height:var(--h);padding:14px;border-radius:var(--rad);border:0;cursor:pointer;text-align:left;text-decoration:none;
  background:var(--c);overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:1.15rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);background-repeat:no-repeat;background-position:center}
.tile::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.tile.circle{aspect-ratio:1;min-height:0;align-self:start;justify-content:center;text-align:center}
.tile.hasimg{background-size:cover;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.tile.imgonly{background-color:transparent;background-size:contain;box-shadow:none;padding:0}
.tile.imgonly::before{display:none}
.tile .lbl-in{position:relative}
.tile small{font:500 .82rem var(--f-body);opacity:.9}
.tile:active{transform:scale(.985)}

.hero{position:relative;overflow:hidden;border-radius:var(--r-card);padding:26px 20px;
  background:linear-gradient(135deg,var(--brand),var(--accent));color:var(--on-brand)}
.hero.has-img{background-size:cover;background-position:center}
.hero.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 80%,transparent),color-mix(in srgb,var(--accent) 55%,transparent))}
.hero>*{position:relative}
.hero h1{color:inherit}
.hero .hi{color:color-mix(in srgb,var(--surface) 75%,#fff)}
.hero p{opacity:.95;margin-top:8px}

.chip{display:inline-flex;padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:600;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--head);border:1px solid var(--line)}

/* amigos: a imagem aparece inteira (corpo todo) */
.friends{--cols:2;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:12px}
.fcard{--c:var(--brand);text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);
  padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit;min-width:0;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fcard:hover{border-color:var(--accent)}
.fig{--ratio:auto;--fit:contain;width:100%;border-radius:calc(var(--r-card) - 8px);overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 28%,#fff),color-mix(in srgb,var(--c) 70%,#fff) 70%,var(--c));
  aspect-ratio:var(--ratio)}
.fig img{display:block;width:100%;height:auto}
.fig.fixed img{height:100%;object-fit:var(--fit);object-position:50% 67%}
.fig.ph{aspect-ratio:3/4;color:#fff;font:700 3.2rem var(--f-display)}
.fcard b{font-family:var(--f-display);color:var(--head);font-size:1.1rem}
.fcard .bio{font-size:.88rem;color:var(--muted)}
.friends.list{grid-template-columns:1fr}
.friends.list .fcard{flex-direction:row;align-items:center}
.friends.list .fig{width:34%;flex:none}
.fcard .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.friends.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.friends.carousel .fcard{flex:0 0 min(72%,260px);scroll-snap-align:start}
.sheet .fig{max-width:300px;margin-inline:auto}
.sheet .fig img{max-height:58vh;width:auto;max-width:100%;margin:auto}
.sheet .fig.fixed img{height:auto;width:100%}
nav.tabs img{width:24px;height:24px;object-fit:contain}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* perfil */
.av{--s:44px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--brand);color:#fff;
  font:800 calc(var(--s) * .46) var(--f-display);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 10px -4px rgba(0,0,0,.4)}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:56%;height:56%}
.avbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card-solid);color:var(--head);border-radius:999px;padding:8px 16px;font:600 .9rem var(--f-body);cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.icons button{aspect-ratio:1;border-radius:var(--r-tile);border:1.5px solid var(--line);background:var(--card-solid);color:var(--head);cursor:pointer;display:grid;place-items:center;padding:0}
.icons button svg{width:50%;height:50%}
.icons button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pal{border:1.5px solid var(--line);background:var(--card-solid);color:var(--ink);border-radius:var(--r-tile);padding:10px;cursor:pointer;text-align:left;font:600 .88rem var(--f-body);display:flex;flex-direction:column;gap:6px}
.pal[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.pal i{display:flex;height:22px;border-radius:999px;overflow:hidden}
.pal i b{flex:1}
/* página do caderno */
.paper{--paper:#FFFDF3;--lines:#9CC7E6;--mline:#E58C8C;--ink2:#2B2F4A;--lh:32px;--fs:18px;--ml:58px;position:relative;overflow:hidden;
  background-color:var(--paper);color:var(--ink2);font-family:var(--f-mono);font-size:var(--fs);line-height:var(--lh);
  border-radius:6px 16px 16px 6px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45),inset -8px 0 12px -10px rgba(0,0,0,.3)}
.pt-ruled{background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--lines) 0),var(--pimg,none);background-size:100% var(--lh),cover}
.pt-grid{background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--lines) 0),linear-gradient(to right,transparent calc(var(--lh) - 1px),var(--lines) 0),var(--pimg,none);background-size:100% var(--lh),var(--lh) 100%,cover}
.pt-dots{background-image:radial-gradient(circle at 1px calc(var(--lh) - 1px),var(--lines) 0 1.5px,transparent 2px),var(--pimg,none);background-size:var(--lh) var(--lh),cover}
.pt-plain{background-image:var(--pimg,none);background-size:cover}
.paper.marg::before{content:"";position:absolute;top:0;bottom:0;left:var(--ml);width:2px;background:var(--mline);opacity:.85;z-index:1;pointer-events:none}
.paper.holes::after{content:"";position:absolute;left:10px;top:0;bottom:0;width:20px;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 10px calc(var(--lh) * 2),rgba(0,0,0,.28) 0 7px,transparent 8px) 0 0/20px calc(var(--lh) * 6)}
.phead{height:calc(var(--lh) * 2);padding:0 18px 0 calc(var(--ml) + 14px);display:flex;flex-direction:column;justify-content:flex-end}
.pdate{font-size:.62em;line-height:var(--lh);height:var(--lh);opacity:.7;letter-spacing:.04em}
.paper .ptitle{display:block;width:100%;height:var(--lh);border:0;background:transparent;color:inherit;font:800 1em/var(--lh) var(--f-display);padding:0;min-height:0;border-radius:0}
.paper textarea.ptext{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;line-height:var(--lh);
  padding:0 18px 0 calc(var(--ml) + 14px);min-height:calc(var(--lh) * 14);resize:none;overflow:hidden;border-radius:0}
.paper input::placeholder,.paper textarea::placeholder{color:inherit;opacity:.4}
.paper :focus-visible{outline:none}
.paper:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent),0 14px 30px -14px rgba(0,0,0,.45)}
@media (max-width:480px){.paper{--ml:40px}}
body.mob .paper{--ml:40px}
.codebox{font:700 1.5rem var(--f-mono);letter-spacing:.1em;text-align:center;padding:18px 10px;border:2px dashed var(--accent);border-radius:var(--r-input);background:var(--card-solid);color:var(--ink);user-select:all;word-break:break-all}
.tut{position:fixed;left:0;right:0;margin-inline:auto;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:55;width:min(420px,calc(100% - 24px));background:var(--card-solid);color:var(--ink);border:1px solid var(--accent);border-radius:var(--r-card);padding:16px 16px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;animation:fup .35s ease both}
.tut h3{margin:0;font:700 1.05rem var(--f-display);color:var(--head)}
.tut p{margin:0;line-height:1.5}
.tut .tdots{display:flex;gap:6px}.tut .tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tut .tdots i.on{background:var(--accent)}
.tut .row{justify-content:space-between;flex-wrap:wrap}
.tut-hl{outline:3px solid var(--extra)!important;outline-offset:3px;border-radius:14px;animation:tutp 1.2s ease-in-out infinite}
@keyframes tutp{50%{outline-color:var(--accent);outline-offset:6px}}
.ideas{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.ideas .idtxt{margin:0;font-weight:600;color:var(--ink);line-height:1.45}
body.mob .tut{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px))}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.preset{border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font:600 .85rem var(--f-body);color:#2b2f4a;min-height:40px}
.welcome{display:flex;flex-direction:column;justify-content:center;line-height:1.2;overflow:hidden;background-repeat:no-repeat;background-position:center;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -14px rgba(0,0,0,.4)}
.welcome.hasimg{text-shadow:0 1px 5px rgba(0,0,0,.6)}
.welcome.onlyimg{background:none;box-shadow:none;padding:0;min-height:0}
.welcome.onlyimg img{display:block;width:100%;height:auto}
/* ficha do personagem, no estilo "meet the artist" */
#profOv{align-items:center;justify-content:center;padding:0}
.profile{--c:#892CB0;--ex:#EE82EE;--fg:#fff;position:relative;width:100%;height:100%;max-width:920px;overflow:hidden;color:var(--fg);
  background:linear-gradient(115deg,var(--c) 0%,var(--c) 38%,color-mix(in srgb,var(--c) 45%,var(--ex)) 70%,var(--ex) 100%)}
body:not(.mob) .profile{height:min(92vh,680px);border-radius:var(--r-card)}
body:not(.mob) #profOv{padding:16px}
.profile::after{content:"";position:absolute;right:-12%;bottom:-18%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 68%);pointer-events:none}
.pmark{position:absolute;right:-2%;top:2%;font:800 clamp(5rem,26vw,12rem) var(--f-display);opacity:.14;line-height:.9;white-space:nowrap;pointer-events:none;user-select:none}
.pinfo{position:relative;z-index:2;width:56%;height:100%;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) 8px 84px 22px;display:flex;flex-direction:column;gap:12px;animation:fup .5s ease both}
.pkick{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.8}
.pname{font:800 clamp(2rem,9.5vw,3.8rem) var(--f-display);line-height:1;color:inherit;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.prole{font:600 1.05rem var(--f-display);margin:0;opacity:.95}
.pquote{font-style:italic;border-left:3px solid currentColor;padding-left:10px;opacity:.95}
.pbio{font-size:.95rem;margin:0}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips span{padding:3px 11px;border-radius:999px;border:1.5px solid currentColor;font-size:.78rem;font-weight:600}
.pdl{display:grid;gap:8px;margin:0}
.pdl div{border-top:1px solid color-mix(in srgb,currentColor 35%,transparent);padding-top:6px}
.pdl dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.75}
.pdl dd{margin:0;font-size:.95rem}
.pfig{position:absolute;right:0;bottom:0;top:6%;width:56%;z-index:1;pointer-events:none;animation:fin .55s cubic-bezier(.2,.8,.2,1) both}
.pfig img{width:100%;height:100%;object-fit:contain;object-position:right bottom;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
.pfig .pinit{position:absolute;right:8%;bottom:10%;font:800 9rem var(--f-display);opacity:.5}
.pclose{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:5;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.85);color:#2b1238;font-size:1.1rem}
.pnav{position:absolute;left:18px;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;align-items:center;font-weight:700}
.pnav button{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.85);color:#2b1238;font-size:1.4rem;line-height:1}
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
input[type=range]{padding:0;min-height:32px;accent-color:var(--accent)}
output{font:600 .85rem var(--f-mono);color:var(--muted)}

/* diário */
.note{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r-input);
  border:1px solid var(--line);background:var(--card-solid);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.note.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.note span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--head);font-family:var(--f-display);font-size:1.15rem;margin-bottom:4px}
.msg{font-size:.9rem;color:var(--muted)}
.err{color:#ff8a80;font-weight:600;font-size:.9rem}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.tabs .in{display:flex;gap:4px;width:100%;max-width:760px}
nav.tabs button{flex:1;min-width:0;border:0;background:none;cursor:pointer;color:var(--muted);font:600 min(.72rem,13px) var(--f-body);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:var(--r-tile)}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--on-brand);background:var(--brand)}

/* sheets */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(20,6,30,.55);display:flex;justify-content:flex-end;align-items:flex-end}
.overlay[hidden]{display:none!important}
.sheet{background:var(--card-solid);color:var(--ink);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  border-radius:var(--r-card) var(--r-card) 0 0;overflow:hidden;margin-inline:auto}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel{border:1px solid var(--line);border-radius:var(--r-tile);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel>summary{cursor:pointer;font:700 1rem var(--f-display);color:var(--head);display:flex;justify-content:space-between;gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.thumb{width:72px;height:72px;border-radius:var(--r-input);object-fit:cover;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:90vw}
.toast[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body:not(.mob) .overlay{align-items:center}
body:not(.mob) .sheet{border-radius:var(--r-card)}
/* formato celular: coluna estreita, alvos de toque maiores, tudo empilhado */
body.mob .wrap{max-width:430px}
body.mob nav.tabs{left:50%;right:auto;width:100%;max-width:430px;transform:translateX(-50%);padding-left:12px;padding-right:12px;border-radius:var(--r-card) var(--r-card) 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
body.mob nav.tabs .in{max-width:100%}
body.mob .overlay{justify-content:center;align-items:flex-end}
body.mob .sheet{max-width:430px;width:100%;margin-inline:auto}
body.mob .profile{max-width:430px;height:100%;border-radius:0}
body.mob .pmark{display:none}
/* ficha no celular (substitui o painel inferior): corpo inteiro e grande à direita, informações na coluna da esquerda */
body.mob .pfig{left:auto;right:-17%;top:auto;bottom:0;width:auto;height:90%;aspect-ratio:9/16}
body.mob .pfig img{width:100%;height:100%;object-fit:contain;object-position:center bottom;transform:none}
body.mob .pinfo{position:relative;width:100%;height:100%;max-height:none;border-radius:0;background:none;box-shadow:none;gap:8px;scrollbar-width:thin;
  padding:max(56px,env(safe-area-inset-top,0px)) calc(54% + 2px) calc(84px + env(safe-area-inset-bottom,0px)) 16px;z-index:2}
body.mob .pinfo>*{text-shadow:0 0 5px var(--c),0 0 10px var(--c),0 1px 2px color-mix(in srgb,var(--c) 70%,#000)}
body.mob .pkick{font-size:.64rem}
body.mob .pname{font-size:clamp(1.7rem,8.4vw,2.2rem)}
body.mob .prole{font-size:.92rem}
body.mob .pquote,body.mob .pbio,body.mob .pdl dd{font-size:.84rem;line-height:1.4}
body.mob .pchips{gap:5px}
body.mob .pchips span{font-size:.72rem;padding:2px 9px;background:color-mix(in srgb,var(--c) 55%,transparent)}
body.mob .pdl{gap:6px}
body.mob .pdl dt{font-size:.62rem}
body.mob .btn,body.mob input,body.mob select{min-height:48px}
body.mob .btn.small{min-height:44px}
body.mob .friends.grid{grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr))}
body.mob .diary-split{flex-direction:column;flex-wrap:nowrap}
body.mob .diary-split>*{flex:none!important;width:100%;min-width:0!important}
body.mob .cols{grid-template-columns:1fr}
body.mob .toast{max-width:min(90vw,400px)}
body.mob .tiles{align-items:stretch}
body.mob .sw{width:38px;height:38px}
body.mob .seg button,body.mob .stabs button{min-height:46px}
body.mob .note{min-height:52px}
body.mob .hero{padding:22px 18px}
body.mob .cols.pc{grid-template-columns:1fr 1fr}
body.mob h1{font-size:clamp(1.7rem,8vw,2.2rem)}
body.mob .paper{margin-inline:-10px;border-radius:4px 14px 14px 4px;min-height:max(58dvh,420px);display:flex;flex-direction:column}
body.mob .paper .ptext{flex:none}
body.mob .paper{scroll-margin-top:12px}
body.mob .ndock{position:sticky;bottom:calc(var(--nav-h) + 8px);z-index:5;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;flex-wrap:nowrap;gap:8px}
body.mob.typing nav.tabs{display:none}
body.mob.typing .ndock{bottom:8px}
body.mob.typing{--nav-h:0px}
body.mob .pmark{font-size:7rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

(function(){ // padroniza os pronomes "Ele/Dele" nas fichas dos personagens já salvas
  var fix=function(x){return typeof x==="string"?x.replace(/\bmais novo\b/g,"mais novos").replace(/(^|\s)á mão(?=\s|$|[.,;])/g,"$1à mão").replace(/\bhobbie\b/gi,"hobby").replace(/\b(?:elde|ele)\s*\/\s*dele\b/gi,"Ele/Dele"):x},ch=false;
  (S.characters||[]).forEach(function(c){Object.keys(c).forEach(function(k){
    if(typeof c[k]==="string"){var n=fix(c[k]);if(n!==c[k]){c[k]=n;ch=true}}
    else if(Array.isArray(c[k]))c[k].forEach(function(it,i){
      if(typeof it==="string"){var n=fix(it);if(n!==it){c[k][i]=n;ch=true}}
      else if(it&&typeof it==="object")Object.keys(it).forEach(function(q){var n=fix(it[q]);if(n!==it[q]){it[q]=n;ch=true}})})})});
  if(S.texts&&S.texts.welcomeTitle==="E ai, beleza?"){S.texts.welcomeTitle="E aí, beleza?";ch=true}
  if(ch)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
})();
(function(){ // começa como novo usuário: limpa só os dados pessoais, uma única vez
  if((S.resetVer||0)>=1)return;var d=defaults();
  S.profile=d.profile;S.answers=[];S.diary=null;S.diaryStyle=d.diaryStyle;S.resetVer=1;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
})();
(function(){ // inclui no conteúdo já salvo as novas ideias e perguntas, sem apagar o que a pessoa editou
  if((S.contentVer||1)>=2)return;var d=defaults();
  d.questions.forEach(function(q){if(S.questions.indexOf(q)<0)S.questions.push(q)});
  d.suggestions.forEach(function(x){if(!S.suggestions.some(function(y){return y.title===x.title}))S.suggestions.push(x)});
  S.contentVer=2;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
})();
(function(){ // v3: personagens com as imagens oficiais, Caio vira Rodrigo e o logo novo

  S.characters.forEach(function(c){var dc=d.characters.filter(function(x){return x.id===c.id})[0];

function normCode(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
async function prepareCode(){var code=newCode(),rs=crypto.getRandomValues(new Uint8Array(16)),rk=await deriveKey(normCode(code),rs);
  D.pending={code:code,rsalt:b64(rs),rwk:await wrapDEK(D.key,rk)}}
async function pwHash(pw,saltB64){var km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({name:"PBKDF2",salt:unb64(saltB64),iterations:150000,hash:"SHA-256"},km,256))}
async function makeAuth(pw){var salt=b64(crypto.getRandomValues(new Uint8Array(16)));return {salt:salt,hash:await pwHash(pw,salt)}}
async function makeRecovery(){var code=newCode(),rs=b64(crypto.getRandomValues(new Uint8Array(16)));return {code:code,rsalt:rs,rhash:await pwHash(normCode(code),rs)}}
function acctCode(v,rec,commit){
  v.innerHTML='<section class="glass stack"><h1>Chave de acesso</h1><p>Se um dia você esquecer a senha de acesso, esta chave é a forma de entrar de novo no seu perfil. Anote em papel e guarde num lugar seguro. Ela aparece só agora.</p>'+
   '<div class="codebox" id="codeShow">'+esc(rec.code)+'</div><div class="row"><button type="button" class="btn ghost small" id="cCopy">Copiar chave</button></div>'+
   '<label class="row"><input type="checkbox" id="cOk"> Anotei a chave num lugar seguro</label><button type="button" class="btn" id="cGo" disabled>Continuar</button></section>';
  $("#cOk").onchange=function(){$("#cGo").disabled=!$("#cOk").checked};
  function sel(){var r=document.createRange();r.selectNodeContents($("#codeShow"));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast("Chave selecionada. Copie e guarde.")}
  $("#cCopy").onclick=function(){try{navigator.clipboard.writeText(rec.code).then(function(){toast("Chave copiada.")},sel)}catch(e){sel()}};
  $("#cGo").onclick=commit}
function showCode(v){var P=D.pending;
  v.innerHTML='<section class="glass stack"><h1>Chave de recuperação</h1><p>Se um dia você esquecer a senha do diário, esta chave é a única forma de abri-lo de novo. Anote em papel e guarde num lugar seguro. Ela aparece só agora.</p>'+
   '<div class="codebox" id="codeShow">'+esc(P.code)+'</div><div class="row"><button type="button" class="btn ghost small" id="cCopy">Copiar chave</button></div>'+
   '<label class="row"><input type="checkbox" id="cOk"> Anotei a chave num lugar seguro</label><button type="button" class="btn" id="cGo" disabled>Continuar</button></section>';
  $("#cOk").onchange=function(){$("#cGo").disabled=!$("#cOk").checked};
  $("#cCopy").onclick=function(){try{navigator.clipboard.writeText(P.code).then(function(){toast("Chave copiada.")},function(){selectCode()})}catch(e){selectCode()}};
  function selectCode(){var r=document.createRange();r.selectNodeContents($("#codeShow"));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast("Chave selecionada. Copie e guarde.")}
  $("#cGo").onclick=function(){S.diary.rsalt=P.rsalt;S.diary.rwk=P.rwk;D.pending=null;saveNow();toast("Chave de recuperação guardada.");viewDiary(v)};
}
async function encryptNotes(){var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},D.key,enc.encode(JSON.stringify(D.notes)));
  S.diary.iv=b64(iv);S.diary.data=b64(ct);save()}
function paperStyle(){var P=S.diaryStyle;return '--paper:'+P.paper+';--lines:'+P.lines+';--mline:'+P.mline+';--ink2:'+P.ink+';--lh:calc('+(+P.lh)+'px * var(--scale));--fs:calc('+(+P.fs)+'px * var(--scale));'+(P.paperImg?'--pimg:url(&quot;'+esc(P.paperImg)+'&quot;);':"")}
function paperHTML(date,title,text,preview){var P=S.diaryStyle;
  return '<div class="paper pt-'+esc(P.type)+(P.margin?' marg':"")+(P.holes?' holes':"")+'" style="'+paperStyle()+'">'+
   '<div class="phead"><span class="pdate">'+esc(date)+'</span><input class="ptitle" id="'+(preview?'pvT':'nTitle')+'" maxlength="80" aria-label="Título da página" placeholder="Título da página" value="'+esc(title)+'"'+(preview?' readonly tabindex="-1"':"")+'></div>'+
   '<textarea class="ptext" id="'+(preview?'pvX':'nText')+'" aria-label="Texto da página" placeholder="Escreva aqui…"'+(preview?' readonly tabindex="-1"':"")+'>'+esc(text)+'</textarea></div>'}
function growPaper(){var ta=document.querySelector(".ptext:not([readonly])");if(!ta)return;ta.style.height="auto";
  var lh=parseFloat(getComputedStyle(ta).lineHeight)||32,h=Math.max(ta.scrollHeight,lh*14);ta.style.height=Math.ceil(h/lh)*lh+"px"}
function viewDiary(v,goPaper,focusTitle){
  if(!(window.crypto&&crypto.subtle)){v.innerHTML='<div class="glass empty"><b>Diário indisponível</b>Este navegador não oferece criptografia. Abra em um navegador atual.</div>';return}
  if(D.pending&&D.key){showCode(v);return}
  if(!S.diary){v.innerHTML='<section class="glass stack"><h1>Seu diário</h1><p>Crie uma senha. Tudo o que você escrever fica trancado com ela, só neste aparelho.</p>'+
    '<div id="dSet" class="stack"><label class="f">Nova senha<input id="dp1" type="password" autocomplete="new-password"></label>'+
    '<label class="f">Repita a senha<input id="dp2" type="password" autocomplete="new-password"></label><p class="err" id="derr">'+esc(D.err)+'</p>'+
    '<button class="btn" type="button" id="dSetGo">Criar diário</button></div><p class="msg">Depois de criar a senha, você recebe uma chave de recuperação para o caso de esquecê-la.</p></section>';
    var mk=async function(){var a=$("#dp1").value,b=$("#dp2").value;
      if(a.length<4){$("#derr").textContent="Use pelo menos 4 caracteres.";return}
      if(a!==b){$("#derr").textContent="As senhas são diferentes.";return}
      try{var salt=crypto.getRandomValues(new Uint8Array(16)),kek=await deriveKey(a,salt);D.key=await genDEK();D.notes=[];
        S.diary={v:2,salt:b64(salt),wk:await wrapDEK(D.key,kek)};await encryptNotes();await prepareCode();D.sel=null;D.err="";viewDiary(v)}
      catch(x){$("#derr").textContent="Não foi possível criar o diário."}};
    $("#dSetGo").onclick=mk;$("#dp2").onkeydown=function(e){if(e.key==="Enter")mk()};return}
  if(!D.key){
    var hasRec=!!(S.diary.rwk&&S.diary.rsalt);
    v.innerHTML='<section class="glass stack"><h1>Diário trancado</h1><div id="dIn" class="stack"><label class="f">Senha<input id="dpw" type="password" autocomplete="current-password"></label>'+
    '<p class="err" id="derr">'+esc(D.err)+'</p><button class="btn" type="button" id="dInGo">Abrir</button></div>'+
    '<details><summary class="muted" style="cursor:pointer">Esqueci a senha</summary><div class="stack" style="margin-top:10px">'+
    (hasRec?'<p class="msg">Digite a chave de recuperação que você anotou e escolha uma senha nova. As suas páginas continuam como estão.</p>'+
      '<label class="f">Chave de recuperação<input id="rcode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX"></label>'+
      '<label class="f">Nova senha<input id="rp1" type="password" autocomplete="new-password"></label>'+
      '<label class="f">Repita a nova senha<input id="rp2" type="password" autocomplete="new-password"></label><p class="err" id="rerr"></p>'+
      '<button class="btn" type="button" id="rGo">Criar nova senha e abrir</button>'+
      '<p class="msg">Sem a chave, só dá para apagar o diário e começar de novo.</p>'
     :'<p class="msg">Este diário foi criado antes da chave de recuperação, então não dá para recuperar a senha. Só dá para apagar o diário e começar de novo. As páginas antigas se perdem.</p>')+
    '<button class="btn danger small" id="dWipe" style="align-self:flex-start">Apagar diário</button></div></details></section>';
    var op=async function(){
      try{var kek=await deriveKey($("#dpw").value,unb64(S.diary.salt)),dek,notes,legacy=false;
        if(S.diary.wk){dek=await unwrapDEK(S.diary.wk,kek);notes=await decryptWith(dek)}
        else{notes=await decryptWith(kek);dek=await genDEK();legacy=true}
        D.key=dek;D.notes=notes;D.pending=null;
        if(legacy){S.diary.wk=await wrapDEK(dek,kek);S.diary.v=2;await encryptNotes()}
        if(!(S.diary.rwk&&S.diary.rsalt))await prepareCode();
        D.sel=D.notes.length?D.notes[0].id:null;D.err="";viewDiary(v)}
      catch(x){D.key=null;$("#derr").textContent="Senha incorreta."}};
    $("#dInGo").onclick=op;$("#dpw").onkeydown=function(e){if(e.key==="Enter")op()};
    if(hasRec){$("#rGo").onclick=async function(){var c=normCode($("#rcode").value),a=$("#rp1").value,b2=$("#rp2").value,er=$("#rerr");
      if(c.length!==16){er.textContent="A chave tem 16 letras e números.";return}
      if(a.length<4){er.textContent="Use pelo menos 4 caracteres na senha nova.";return}
      if(a!==b2){er.textContent="As senhas novas são diferentes.";return}
      try{var rk=await deriveKey(c,unb64(S.diary.rsalt)),dek=await unwrapDEK(S.diary.rwk,rk),notes=await decryptWith(dek);
        var salt=crypto.getRandomValues(new Uint8Array(16)),kek=await deriveKey(a,salt);
        S.diary.salt=b64(salt);S.diary.wk=await wrapDEK(dek,kek);S.diary.v=2;saveNow();
        D.key=dek;D.notes=notes;D.pending=null;D.sel=notes.length?notes[0].id:null;toast("Senha nova definida.");viewDiary(v)}
      catch(x){er.textContent="Chave de recuperação incorreta."}}}
    var w=$("#dWipe");w.onclick=function(){if(w.dataset.s!=="1"){w.dataset.s="1";w.textContent="Toque de novo para apagar tudo";return}
      S.diary=null;D.key=null;D.notes=[];D.pending=null;save();viewDiary(v)};return}
  var cur_=D.notes.find(function(n){return n.id===D.sel});
  v.innerHTML='<div class="stack"><div class="row"><h1 class="grow">Diário</h1><button class="btn ghost small" id="dLock">Trancar</button></div>'+
   '<div class="row diary-split" style="align-items:flex-start"><div class="stack grow notelist" style="min-width:220px;flex:1 1 220px"><button class="btn" id="dNew">Nova página</button>'+
   (D.notes.length?D.notes.map(function(n){return '<button class="note'+(n.id===D.sel?' on':'')+'" data-note="'+n.id+'"><span><b>'+esc(n.title||"Sem título")+'</b></span><small class="muted">'+esc(n.date)+'</small></button>'}).join(""):'<div class="glass empty"><b>Nada por aqui ainda</b>Toque em “Nova página” para escrever a primeira.</div>')+
   '</div><div class="stack" style="flex:2 1 320px;min-width:0">'+
   '<div class="glass ideas"><b style="color:var(--head)">Sem ideia do que escrever?</b><p class="idtxt" id="idText">'+esc(IDEAS[ideaI])+'</p><div class="row"><button type="button" class="btn ghost small" id="idNext">Outra ideia</button><button type="button" class="btn small" id="idUse">Usar na página</button></div></div>'+
   (cur_?paperHTML(cur_.date,cur_.title,cur_.text,false)+
     '<div class="row ndock"><span class="msg grow" id="nState">Salvo</span><button class="btn small" id="nDone">Pronto</button><button class="btn danger small" id="nDel">Apagar página</button></div>':'<div class="glass"><p class="muted">Escolha uma página ou crie uma nova.</p></div>')+'</div></div>'+
   '<details class="glass"><summary style="cursor:pointer;font-weight:600;color:var(--head)">Segurança do diário</summary><div class="stack" style="margin-top:12px">'+
     '<strong style="color:var(--head)">Trocar senha</strong><label class="f">Nova senha<input id="sp1" type="password" autocomplete="new-password"></label><label class="f">Repita a nova senha<input id="sp2" type="password" autocomplete="new-password"></label><p class="err" id="serr"></p><button type="button" class="btn small" id="spGo" style="align-self:flex-start">Trocar senha</button>'+
     '<strong style="color:var(--head)">Chave de recuperação</strong><p class="msg">Gere uma chave nova se perdeu a anterior. Depois de guardar a nova, a antiga deixa de funcionar.</p><button type="button" class="btn ghost small" id="newKey" style="align-self:flex-start">Gerar nova chave</button>'+
   '</div></details></div>';
  $("#dLock").onclick=function(){D.key=null;D.notes=[];D.sel=null;D.pending=null;viewDiary(v)};
  $("#spGo").onclick=async function(){var a=$("#sp1").value,b2=$("#sp2").value,er=$("#serr");
    if(a.length<4){er.textContent="Use pelo menos 4 caracteres.";return}if(a!==b2){er.textContent="As senhas são diferentes.";return}
    try{var salt=crypto.getRandomValues(new Uint8Array(16)),kek=await deriveKey(a,salt);S.diary.salt=b64(salt);S.diary.wk=await wrapDEK(D.key,kek);S.diary.v=2;saveNow();$("#sp1").value="";$("#sp2").value="";er.textContent="";toast("Senha trocada.")}
    catch(x){er.textContent="Não foi possível trocar a senha."}};
  $("#newKey").onclick=async function(){try{await prepareCode();viewDiary(v)}catch(x){toast("Não foi possível gerar a chave.")}};
  $("#idNext").onclick=function(){ideaI=(ideaI+1)%IDEAS.length;$("#idText").textContent=IDEAS[ideaI]};
  $("#idUse").onclick=async function(){var idea=IDEAS[ideaI];
    if(!cur_){var n={id:uid(),title:"",text:idea+"\n\n",date:new Date().toLocaleDateString("pt-BR")};D.notes.unshift(n);D.sel=n.id;await encryptNotes();viewDiary(v,true,false);setTimeout(function(){var t=$("#nText");if(t){t.focus();var l=t.value.length;try{t.setSelectionRange(l,l)}catch(x){}}},120);return}
    var ta=$("#nText");ta.value=ta.value.trim()?ta.value.replace(/\s*$/,"")+"\n\n"+idea+"\n\n":idea+"\n\n";
    ta.dispatchEvent(new Event("input"));ta.focus();var l2=ta.value.length;try{ta.setSelectionRange(l2,l2)}catch(x){}};
  $("#dNew").onclick=async function(){var n={id:uid(),title:"",text:"",date:new Date().toLocaleDateString("pt-BR")};D.notes.unshift(n);D.sel=n.id;await encryptNotes();viewDiary(v,true,true)};
  if(cur_){var tm;var upd=function(){cur_.title=$("#nTitle").value;cur_.text=$("#nText").value;var st0=$("#nState");if(st0)st0.textContent="Salvando…";clearTimeout(tm);tm=setTimeout(async function(){
      await encryptNotes();var s=$("#nState");if(s)s.textContent="Salvo";
      var b=document.querySelector('[data-note="'+cur_.id+'"] b');if(b)b.textContent=cur_.title||"Sem título"},500)};
    growPaper();setTimeout(growPaper,300);
    if(goPaper&&document.body.classList.contains("mob")){setTimeout(function(){var pe=document.querySelector(".paper");if(pe)pe.scrollIntoView({behavior:"smooth",block:"start"});if(focusTitle){try{$("#nTitle").focus({preventScroll:true})}catch(x){}}},60)}
    var pp=document.querySelector(".paper"),ta0=$("#nText");
    pp.addEventListener("click",function(e){if(e.target===pp||e.target.classList.contains("phead")){ta0.focus();var n=ta0.value.length;try{ta0.setSelectionRange(n,n)}catch(x){}}});
    var typ=function(on){document.body.classList.toggle("typing",on)};
    [$("#nTitle"),ta0].forEach(function(el){el.addEventListener("focus",function(){typ(true)});el.addEventListener("blur",function(){setTimeout(function(){var a=document.activeElement;typ(!!(a&&(a.id==="nTitle"||a.id==="nText")))},120)})});
    $("#nDone").onclick=function(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();typ(false)};
    $("#nTitle").oninput=upd;$("#nText").oninput=function(){growPaper();upd()};
    var d=$("#nDel");d.onclick=async function(){if(d.dataset.s!=="1"){d.dataset.s="1";d.textContent="Toque de novo para apagar";return}
      D.notes=D.notes.filter(function(n){return n.id!==cur_.id});D.sel=D.notes.length?D.notes[0].id:null;await encryptNotes();viewDiary(v)}}
}

$("#whatIs").onclick=function(){openSheet("O que é o AdoleSente?",'<div class="about"><p>AdoleSente é um lugar que tem a intenção de servir como uma pequena diversão diária na vida do jovem. Faz com que você possa pensar um pouco menos nas coisas que te atrapalham diariamente e poder "viajar" um pouquinho mais nas suas ideias!</p><p>Você pode escrever, responder perguntas aleatórias e fazer as pequenas coisas que são sugeridas diariamente. O AdoleSente também tem a companhia de alguns amigos, um grupo de personagens que você pode conhecer um pouquinho. Vai que você se identifica com algum deles, né?</p><p><strong>Solta o artista que tem dentro de você e vem curtir o AdoleSente!</strong></p>'+(S.profile.done&&!S.loggedOut?'<button type="button" class="btn ghost small" id="aboutTut">Ver o tutorial</button>':'')+'</div>');var at=$("#aboutTut");if(at)at.onclick=tutStart};
$("#openProfile").onclick=function(){go("profile")};
var brandEl=$("#brand");brandEl.setAttribute("role","link");brandEl.setAttribute("tabindex","0");brandEl.setAttribute("aria-label","AdoleSente: ir para o início");
var goHome=function(){if(S.loggedOut||!S.profile.done)return;closeAll();go("home")};
brandEl.onclick=goHome;brandEl.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();goHome()}};
var SIZES=[100,125,150,175];
$("#textSize").onclick=function(){var c0=S.profile.textSize||100,i=SIZES.indexOf(c0);S.profile.textSize=SIZES[(i+1)%SIZES.length];save();applyTheme();toast("Texto em "+S.profile.textSize+"%");if(cur==="profile")renderView()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll();if(!$("#profOv").hidden&&S.characters.length>1){if(e.key==="ArrowRight")stepProfile(1);if(e.key==="ArrowLeft")stepProfile(-1)}});
window.addEventListener("hashchange",function(){var h=location.hash.replace("#","");if(SCREENS[h]&&h!==cur){cur=h;renderNav();renderView()}});

window.addEventListener("error",function(e){toast("Erro: "+e.message)});
applyTheme();renderNav();renderView();setTimeout(tutAsk,600);
})();
</script>

</body>
</html>
